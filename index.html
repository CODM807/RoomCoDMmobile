<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<title>روم کیل کالاف</title>
<style>




:root{--bg:#0b0f14;--card:#141b24;--text:#e8eef5;--muted:#93a1b3;--acc:#f5a524;--acc2:#ff4d4d;--line:#223041;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f6f9;--card:#fff;--text:#111a24;--muted:#556375;--line:#d9e0e8;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.9}
.wrap{max-width:760px;margin:auto;padding:20px}
.top{text-align:center;padding:28px 16px 4px;background:radial-gradient(circle at 50% 0,rgba(245,165,36,.18),transparent 60%)}
.tag{display:inline-block;border:1px solid var(--acc);color:var(--acc);padding:2px 14px;border-radius:99px;font-size:13px}
h1{font-size:clamp(22px,5.5vw,30px);margin:10px 0 0;font-weight:900}
h2{font-size:22px;margin:36px 0 12px}
h2::before{content:'';display:inline-block;width:6px;height:20px;background:var(--acc2);border-radius:3px;margin-inline-end:10px;vertical-align:-3px}
.room{margin-top:20px;text-align:center;padding:32px 18px;border-radius:20px;border:2px solid var(--acc);background:linear-gradient(135deg,rgba(245,165,36,.2),rgba(255,77,77,.14))}
.room .ic{font-size:56px;line-height:1.2}
.room h3{font-size:clamp(26px,7vw,38px);margin:6px 0;font-weight:900}
.room h3 span{color:var(--acc)}
.big{font-size:clamp(34px,10vw,56px);font-weight:900;color:var(--acc);line-height:1.4}
.big small{display:block;font-size:15px;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stats b{display:block;font-size:20px}
.stats small{color:var(--muted)}
.btn{display:inline-block;background:var(--acc);color:#111;font-weight:900;font-size:18px;padding:14px 36px;border-radius:14px;text-decoration:none}
ol,ul{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 36px 16px 16px;margin:0}
li{margin:6px 0}
.cta{text-align:center;margin:40px 0 20px;padding:28px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sub{color:var(--muted);margin:0 0 18px}
.cd{margin:18px 0 4px;color:var(--muted)}
.timer{display:flex;justify-content:center;gap:8px;direction:ltr}
.timer div{background:var(--card);border:1px solid var(--acc);border-radius:12px;min-width:64px;padding:8px 4px}
.timer b{display:block;font-size:28px;color:var(--acc);line-height:1.3}
.timer small{color:var(--muted);font-size:12px}
.started{font-size:22px;font-weight:900;color:var(--acc2)}
.pl{margin:16px 0 4px}
.pl .bar{height:14px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.pl .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
.pl .t{margin-top:6px;font-weight:700}
.sgrid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px;direction:ltr}
.sl{width:30px;height:30px;line-height:30px;font-size:12px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.sl{cursor:pointer}
.slinfo{margin-top:8px;font-weight:700;min-height:1.9em;unicode-bidi:plaintext}
.sl.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}

body{background:radial-gradient(900px 520px at 90% -8%,rgba(255,77,77,.24),transparent 60%),radial-gradient(820px 520px at 5% 0,rgba(245,165,36,.2),transparent 60%),var(--bg);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(circle at 50% 18%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 18%,#000,transparent 72%)}
.top,.wrap,footer{position:relative;z-index:1}
.top{padding:36px 16px 6px}
.tag{background:rgba(245,165,36,.1);letter-spacing:.6px;box-shadow:0 0 20px rgba(245,165,36,.28)}
h1{font-size:clamp(28px,8vw,44px);background:linear-gradient(90deg,var(--text),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
h2::before{box-shadow:0 0 12px var(--acc2)}
.room{position:relative;overflow:hidden;border:1px solid rgba(245,165,36,.6);background:linear-gradient(160deg,rgba(245,165,36,.18),rgba(255,77,77,.11) 55%,rgba(20,27,36,.55));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,77,77,.16),0 24px 64px -24px rgba(245,165,36,.5),inset 0 1px 0 rgba(255,255,255,.08)}
.room::before{content:'';position:absolute;top:-120px;left:-100px;width:320px;height:320px;background:radial-gradient(circle,rgba(255,77,77,.34),transparent 65%);pointer-events:none}
.room>*{position:relative}
.room .ic{animation:fpulse 2.2s ease-in-out infinite}
@keyframes fpulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 10px rgba(255,120,40,.7))}50%{transform:scale(1.13);filter:drop-shadow(0 0 24px rgba(255,120,40,.95))}}
.room h3{text-shadow:0 2px 22px rgba(245,165,36,.4)}
.big{background:linear-gradient(180deg,#ffd98a,var(--acc) 55%,#ff7a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(245,165,36,.35))}
.timer div{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01));border-color:rgba(245,165,36,.6);box-shadow:0 0 18px rgba(245,165,36,.2);min-width:68px;border-radius:14px}
.timer b{font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(245,165,36,.6)}
.pl .bar{height:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.pl .bar i{background:linear-gradient(90deg,#f5a524,#ff4d4d);box-shadow:0 0 14px rgba(255,120,40,.85)}
.sl{border-radius:10px;background:rgba(255,255,255,.04);transition:transform .15s,border-color .15s}
.sl:hover{transform:translateY(-2px);border-color:var(--acc);color:var(--text)}
.sl.on{background:linear-gradient(135deg,#f5a524,#ff7a2a);color:#111;box-shadow:0 0 12px rgba(245,165,36,.6)}
.slinfo{display:inline-block;padding:6px 16px;border-radius:99px;background:rgba(127,127,127,.16);font-size:14px}
.stats div{background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.stats b{color:var(--acc)}
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#ffb938,#ff7a2a);box-shadow:0 12px 28px -8px rgba(255,122,42,.75);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:140%}}
.wrap>ol{counter-reset:s;list-style:none;padding:0;background:transparent;border:0;display:grid;gap:10px}
.wrap>ol li{counter-increment:s;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0}
.wrap>ol li::before{content:counter(s,persian);flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#111;background:linear-gradient(135deg,#ffb938,#ff7a2a);box-shadow:0 0 12px rgba(245,165,36,.5)}
.wrap>ul{list-style:none;padding:10px 14px}
.wrap>ul li{position:relative;padding-inline-start:28px}
.wrap>ul li::before{content:'⚠️';position:absolute;inset-inline-start:0;font-size:15px}
.cta{background:linear-gradient(135deg,rgba(245,165,36,.16),rgba(255,77,77,.12));border-color:rgba(245,165,36,.5);box-shadow:0 20px 50px -26px rgba(245,165,36,.6)}
.payout{margin-top:12px;padding:18px;border-radius:16px;background:linear-gradient(135deg,rgba(80,200,120,.14),rgba(245,165,36,.1));border:1px solid rgba(80,200,120,.5);box-shadow:0 18px 44px -26px rgba(80,200,120,.6)}
.payout p{margin:0 0 10px}
.payout .note{color:var(--muted);font-size:14px;margin:12px 0 14px}
.payout .btn{font-size:16px;padding:12px 26px}
.support{margin:22px 0 0;text-align:center;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.support p{margin:0 0 12px;color:var(--muted)}
.support .btn{font-size:16px;padding:12px 26px}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;padding:11px 18px;border-radius:99px;background:linear-gradient(135deg,#3aa7ff,#2a6df5);color:#fff;font-weight:700;font-size:15px;text-decoration:none;box-shadow:0 12px 30px -8px rgba(42,109,245,.8)}
.fab:active{transform:scale(.96)}
footer{padding-bottom:84px}
html,body{min-height:100%}
.wrap{max-width:none;width:100%;padding:20px clamp(14px,4vw,56px)}
.room{padding:clamp(24px,5vw,56px) clamp(16px,4vw,48px)}
.stats{max-width:900px;margin:20px auto}
@media (min-width:900px){.big{font-size:76px}.timer{gap:14px}.timer div{min-width:100px}.timer b{font-size:42px}.sl{width:40px;height:40px;line-height:40px;font-size:14px}.wrap>ol{grid-template-columns:repeat(2,1fr)}.sgrid{max-width:760px;margin-inline:auto}}
@media (prefers-reduced-motion:reduce){.room .ic,.btn::after{animation:none}}


#edBtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;padding:11px 18px;border-radius:99px;border:0;background:linear-gradient(135deg,#ffb938,#ff7a2a);color:#111;font:inherit;font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 12px 28px -8px rgba(255,122,42,.8)}
#edOverlay{position:fixed;inset:0;z-index:100;overflow-y:auto;background:var(--bg);color:var(--text);padding:16px clamp(14px,4vw,40px) 100px}
#edOverlay h2{margin:8px 0 14px}
#edOverlay label{display:block;margin:12px 0 4px;font-size:14px;color:var(--muted)}
#edOverlay input,#edOverlay textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#edOverlay textarea{min-height:90px}
#edOverlay .bar2{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
#edOverlay .bar2 button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
#edOverlay .bar2 .ok{background:linear-gradient(135deg,#ffb938,#ff7a2a);color:#111;border:0}
#edMsg{margin-top:12px;color:var(--acc)}


.rooms-wrap{display:grid;gap:20px}
.room+.room{margin-top:0}
#edOverlay .rbox{border:1px solid var(--acc);border-radius:14px;padding:12px 14px 16px;margin:18px 0;background:rgba(245,165,36,.05)}
#edOverlay .rbox h3{margin:4px 0 0;color:var(--acc)}
#edOverlay .addroom{width:100%;padding:12px;border-radius:12px;border:1px dashed var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:900;cursor:pointer;margin:6px 0}
#edOverlay .delroom{margin-top:12px;padding:8px 14px;border-radius:10px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);font:inherit;font-weight:700;cursor:pointer}

.lock{margin:16px auto;max-width:440px;padding:14px;border-radius:14px;border:1px solid var(--acc);background:rgba(0,0,0,.22)}
.lock .lk-t{font-weight:900;font-size:18px}
.lock .lk-s{color:var(--muted);font-size:14px;margin:2px 0 10px}
.lock .lk-row{display:flex;gap:8px}
.lock .lk-in{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:center;direction:ltr}
.lock .lk-b{padding:10px 16px;border-radius:10px;border:0;background:linear-gradient(135deg,#ffb938,#ff7a2a);color:#111;font:inherit;font-weight:900;cursor:pointer}
.lock .lk-out{margin-top:10px;font-weight:900;font-size:20px;white-space:pre-wrap;word-break:break-all;color:var(--acc);unicode-bidi:plaintext}

.txt{margin:12px 0}.txt p{margin:0 0 10px}
.wrap>.btnrow{text-align:center;margin:22px 0}
.sec-img{margin:20px 0;text-align:center}.sec-img img{max-width:100%;border-radius:16px;border:1px solid var(--line)}.sec-img figcaption{color:var(--muted);font-size:14px;margin-top:6px}
.sec-hr{border:0;height:1px;background:var(--line);margin:28px 0}
.wrap>section.payout,.wrap>section.support{margin-top:22px}
#edOverlay select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
#edOverlay .sbox{border:2px solid var(--line);border-radius:16px;padding:12px 14px 16px;margin:20px 0;background:rgba(255,255,255,.03)}
#edOverlay .shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
#edOverlay .stools{display:flex;gap:6px}
#edOverlay .stools button{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
#edOverlay .stools .del{color:var(--acc2);border-color:var(--acc2)}
#edOverlay .addbox{margin:24px 0 8px;padding:12px;border:1px dashed var(--acc);border-radius:14px}

#edOverlay .tabs{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
#edOverlay .tabs button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
#edOverlay .tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}
body.editing{padding-top:64px}
#edBar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:var(--card);border-bottom:2px solid var(--acc)}
#edBar button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
#edBar .sv{background:var(--acc);color:#111;border:0}
#edStat{font-size:13px;color:var(--muted)}
.secbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin:26px 0 8px;padding:6px 10px;border:1px dashed var(--acc);border-radius:12px;background:rgba(245,165,36,.08);position:relative;z-index:2}
.secbar .sl2{font-weight:700;font-size:14px}
.secbar .st{display:flex;gap:6px;flex-wrap:wrap}
.secbar button{padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.secbar .ed{background:var(--acc);color:#111;border:0}
.secbar .del{color:var(--acc2)}
.addbig{display:block;width:100%;margin:24px 0;padding:16px;border-radius:14px;border:2px dashed var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:900;font-size:18px;cursor:pointer;position:relative;z-index:2}
#edOverlay .prow{display:flex;gap:6px;margin:6px 0}
#edOverlay .prow .ps{width:90px;flex:none}
#edOverlay .prow .pc{flex:1}
#edOverlay .prow .del{flex:none;padding:6px 12px;border-radius:10px;border:1px solid var(--acc2);background:transparent;color:var(--acc2);font:inherit;cursor:pointer}
#edOverlay .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#edOverlay .tbtn{padding:18px 8px;border-radius:14px;border:1px solid var(--acc);background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:16px;cursor:pointer}

/* ویرایشگر کامل کد */
#sourceEditor{position:fixed;inset:0;z-index:9999;background:#0b0f14;color:#e8eef5;display:flex;flex-direction:column;padding:10px;gap:8px}
#sourceEditor[hidden]{display:none}
#sourceEditor .se-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sourceEditor .se-head strong{flex:1;font-size:15px}
#sourceEditor .se-head button{padding:9px 13px;border:1px solid #334155;border-radius:9px;background:#18212d;color:#fff;font:inherit}
#sourceEditor .se-head .se-save{background:#f5a524;color:#111;border:0;font-weight:900}
#sourceEditor .se-area{flex:1;min-height:0;direction:ltr;text-align:left}
#sourceEditor .CodeMirror{height:100%;font:14px/1.65 Consolas,monospace;border:1px solid #334155;border-radius:10px}
#sourceEditor .se-status{font-size:12px;color:#aab6c5;min-height:1.5em}


/* ===== ویرایش ۲ ===== */
:root[data-theme="light"]{--bg:#f4f6f9;--card:#fff;--text:#111a24;--muted:#556375;--line:#d9e0e8;color-scheme:light}
.tools{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:40;display:flex;gap:8px}
.tools button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
#toTop{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:44px;height:44px;border-radius:50%;border:1px solid var(--acc);background:var(--card);color:var(--acc);font-size:20px;cursor:pointer;display:none}
.chip{display:inline-block;margin-top:8px;padding:2px 14px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--line)}
.chip.open{color:#3ddc84;border-color:#3ddc84}.chip.full{color:var(--acc2);border-color:var(--acc2)}.chip.live{color:var(--acc);border-color:var(--acc)}
.rtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 0}
.rtools button,.rtools a{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.fnd{display:flex;gap:6px;margin-top:10px;direction:rtl}
.fnd input{flex:1;min-width:0;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:center}
.fnd button{padding:9px 14px;border-radius:10px;border:0;background:var(--acc);color:#111;font:inherit;font-weight:900;cursor:pointer}
.sl.hit{outline:3px solid var(--acc2);transform:scale(1.15)}
.calc{margin:16px auto 0;max-width:440px;padding:14px;border-radius:14px;border:1px dashed var(--acc);background:rgba(0,0,0,.14)}
.calc .ct{font-weight:900}.calc input{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;text-align:center}
.calc .co{margin-top:8px;font-size:22px;font-weight:900;color:var(--acc)}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:8px 0}
.faq summary{cursor:pointer;font-weight:700;padding:8px 0}
.faq details p{margin:0 0 10px;color:var(--muted)}
#edOverlay .prow .pt{flex:1;min-width:0}
.rooms-wrap{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 2px 14px;scrollbar-width:thin}
.rooms-wrap>.room{flex:0 0 100%;min-width:0;scroll-snap-align:center}
.rooms-wrap.multi>.room{flex-basis:88%}
@media (min-width:1300px){.rooms-wrap.multi>.room{flex-basis:calc(50% - 8px)}}
.r-dtoggle{display:block;margin:10px auto 0;padding:8px 18px;border-radius:99px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.rhint{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 4px}
.rdots{display:flex;justify-content:center;gap:8px;margin:2px 0 8px}
.rdots button{width:10px;height:10px;padding:0;border-radius:50%;border:1px solid var(--acc);background:transparent;cursor:pointer}

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function fa(n){ return Number(n).toLocaleString('fa-IR',{useGrouping:false}); }
  function two(n){ return n.toLocaleString('fa-IR',{minimumIntegerDigits:2,useGrouping:false}); }
  function toEn(s){
    return String(s).replace(/[\u06f0-\u06f9]/g,function(d){return '\u06f0\u06f1\u06f2\u06f3\u06f4\u06f5\u06f6\u06f7\u06f8\u06f9'.indexOf(d);})
                    .replace(/[\u0660-\u0669]/g,function(d){return '\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'.indexOf(d);});
  }
  function toast(t){ var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.style.display = 'none'; }, Math.max(1800, String(t).length * 110)); }
  function copyTxt(t){ try { navigator.clipboard.writeText(t).then(function(){ toast('کپی شد ✅'); }); } catch(x) { toast(t); } }
  function tgAll(){ try { return JSON.parse(localStorage.getItem('tg2') || '{}'); } catch(x) { return {}; } }
  function tgGet(r, slot){ var m = tgAll()[r.name + '|' + r.startTime]; return (m && m[slot]) || ''; }
  function tgPut(k, m){ try { var a = tgAll(); a[k] = m; localStorage.setItem('tg2', JSON.stringify(a)); } catch(x) {} }
  function shrink(f, cb){
    var rd = new FileReader();
    rd.onload = function(){ var im = new Image(); im.onload = function(){
      var k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.72));
    }; im.onerror = function(){ toast('عکس خوانده نشد، عکس دیگری امتحان کن'); }; im.src = rd.result; };
    rd.readAsDataURL(f);
  }
  function norm(p){ return toEn(p).trim().toLowerCase(); }

  /* ---------- داده‌ها ---------- */
  function migrate(c){
    if (c.sections) return c;
    var rooms = c.rooms || [{icon: c.icon, name: c.roomName, prize: c.prize, prizeLabel: c.prizeLabel, entryFee: c.entryFee, capacity: c.capacity,
      startTime: c.startTime, dateText: c.dateText, clockText: c.clockText, startedText: c.startedText, players: c.players || []}];
    return {pageTitle: c.pageTitle, tag: c.tag, heading: c.heading, telegram: c.telegram, footer: c.footer, fabText: '🛠️ پشتیبانی',
      sections: [
        {type: 'rooms', title: '', rooms: rooms},
        {type: 'list', title: 'چطور شرکت کنم؟', style: 'steps', items: c.steps},
        {type: 'card', title: 'دریافت جایزه', color: 'green', body: [c.payout1, c.payout2, c.payoutNote].join('\n'), btnText: 'ارسال شماره کارت در پی‌وی', btnLink: ''},
        {type: 'list', title: 'قوانین', style: 'bullets', items: c.rules},
        {type: 'card', title: '🛠️ پشتیبانی', color: 'plain', body: c.supportText, btnText: 'پیام به پشتیبانی در تلگرام', btnLink: ''},
        {type: 'card', title: 'ثبت‌نام', color: 'orange', body: 'برای ثبت‌نام و دریافت اطلاعات روم، در تلگرام پیام بدهید.', btnText: 'ثبت‌نام در تلگرام', btnLink: ''}
      ]};
  }
  var C = migrate(JSON.parse($('cfg').textContent));

  function link(l){
    l = String(l || '').trim();
    if (!l) return 'https://t.me/' + C.telegram;
    if (/^(https?:\/\/|tel:|mailto:)/i.test(l)) return l;
    if (l.charAt(0) === '@') return 'https://t.me/' + l.slice(1);
    if (/^t\.me\//i.test(l)) return 'https://' + l;
    return 'https://t.me/' + l;
  }

  /* ---------- رمزگذاری کد روم ---------- */
  function b64(u8){ var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function deriveKey(pass, salt){
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  }
  async function encrypt(text, pass){
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(pass, salt);
    var ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv: iv}, key, new TextEncoder().encode(text));
    return {s: b64(salt), i: b64(iv), c: b64(new Uint8Array(ct))};
  }

  /* ---------- نمایش سایت ---------- */
  function pfmt(o, ms){
    try { if (isNaN(ms)) return ''; return new Intl.DateTimeFormat('fa-IR-u-ca-persian', Object.assign({timeZone: 'Asia/Tehran'}, o)).format(ms); } catch(x) { return ''; }
  }
  function makeRoom(r){
    var e = $('roomTpl').content.cloneNode(true).querySelector('.room');
    function q(c){ return e.querySelector('.' + c); }
    q('r-icon').textContent = r.icon; q('r-name').textContent = r.name;
    var dscs = e.querySelectorAll('.r-desc'), dsc = dscs[0];
    if (dscs[1]) dscs[1].style.display = 'none';
    if (r.desc) {
      paras(dsc, r.desc); dsc.style.display = 'none';
      var tg = el('button', 'r-dtoggle', '📄 نمایش توضیحات'); tg.type = 'button';
      tg.onclick = function(){ var open = dsc.style.display === 'none'; dsc.style.display = open ? '' : 'none'; tg.textContent = open ? '🙈 مخفی کردن توضیحات' : '📄 نمایش توضیحات'; };
      dsc.parentNode.insertBefore(tg, dsc);
    } else dsc.style.display = 'none';
    q('r-prize').textContent = r.prize; q('r-prizeLabel').textContent = r.prizeLabel;
    var ms0 = new Date(r.startTime).getTime();
    var pd = pfmt({weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}, ms0), pc = pfmt({hour: '2-digit', minute: '2-digit', hour12: false}, ms0);
    var pw = pfmt({weekday: 'long'}, ms0), ps = pfmt({day: 'numeric', month: 'long'}, ms0);
    q('r-date').textContent = (pd || r.dateText) + ' · ساعت ' + (pc || r.clockText);
    q('r-fee').textContent = r.entryFee; q('r-cap').textContent = fa(r.capacity) + ' نفر';
    var dp = String(r.dateText || '').split(' ');
    q('r-sdate').textContent = ps || (dp.length >= 4 ? dp.slice(1, 3).join(' ') : r.dateText);
    q('r-clock').textContent = (pw && pc) ? pw + ' ' + pc : r.clockText;
    q('r-btn').href = link('');
    e.setAttribute('data-start', new Date(r.startTime).getTime());
    e.setAttribute('data-started', r.startedText); e.setAttribute('data-status', r.status || '');
    var taken = {}; r.players.forEach(function(p){ taken[p.slot] = p.cod; });
    var count = r.players.length, cap = r.capacity;
    q('r-txt').textContent = count >= cap ? 'ظرفیت تکمیل شد' : fa(count) + ' از ' + fa(cap) + ' نفر داخل روم';
    q('r-bar').style.width = (cap ? Math.min(count, cap) / cap * 100 : 0) + '%';
    var g = q('r-grid'), info = q('r-info');
    for (var i = 1; i <= cap; i++) {
      var d = document.createElement('div');
      d.className = 'sl' + (taken[i] !== undefined ? ' on' : '');
      d.textContent = fa(i);
      d.onclick = (function(n){ return function(){
        info.textContent = (taken[n] !== undefined ? 'جایگاه ' + fa(n) + ' · آیدی کالاف: ' + taken[n] : 'جایگاه ' + fa(n) + ' خالی است') + (taken[n] !== undefined && document.body.classList.contains('owner') && tgGet(r, n) ? ' · تلگرام: ' + tgGet(r, n) : '');
      }; })(i);
      g.appendChild(d);
    }

    /* --- ویرایش ۲: وضعیت، جستجو، ماشین‌حساب، تقویم --- */
    var full = count >= cap;
    var chip = q('r-chip');
    chip.className = 'chip r-chip owner-only ' + (ms0 <= Date.now() ? 'live' : full ? 'full' : 'open');
    chip.textContent = ms0 <= Date.now() ? '🔴 در حال برگزاری / تمام‌شده' : full ? '⛔ ظرفیت تکمیل' : '🟢 ثبت‌نام باز · ' + fa(cap - count) + ' جای خالی';
    if (r.status === 'live') { chip.className = 'chip r-chip owner-only live'; chip.textContent = '🔴 در حال برگزاری'; } else if (r.status === 'finished') { chip.className = 'chip r-chip owner-only full'; chip.textContent = '✅ بازی تمام شد'; }
    var cells = g.children, fin = q('f-in');
    function clr(){ Array.prototype.forEach.call(cells, function(c){ c.classList.remove('hit'); }); }
    q('f-b').onclick = function(){
      clr(); var v = fin.value.trim().toLowerCase(); if (!v) return;
      var found = null; Object.keys(taken).forEach(function(k){ if (String(taken[k]).toLowerCase().indexOf(v) > -1) found = Number(k); });
      if (found) { cells[found - 1].classList.add('hit'); cells[found - 1].scrollIntoView({block:'center',behavior:'smooth'}); cells[found - 1].onclick(); }
      else info.textContent = 'این آیدی در لیست نیست';
    };
    fin.onkeydown = function(ev){ if (ev.key === 'Enter') q('f-b').onclick(); };
    q('f-free').onclick = function(){
      clr(); for (var i = 1; i <= cap; i++) if (taken[i] === undefined) { cells[i - 1].classList.add('hit'); cells[i - 1].scrollIntoView({block:'center',behavior:'smooth'}); cells[i - 1].onclick(); return; }
      info.textContent = 'همه جایگاه‌ها پر است';
    };
    var perKill = parseInt(toEn(String(r.prize).replace(/[^\d\u06f0-\u06f9\u0660-\u0669]/g, ''))) || 0;
    q('c-in').oninput = function(){
      var k = parseInt(toEn(this.value)) || 0;
      q('c-out').textContent = (k * perKill).toLocaleString('fa-IR') + ' تومان';
    };
    q('r-ics').onclick = function(){
      var d = new Date(ms0), z = function(n){ return String(n).padStart(2, '0'); };
      var f = function(x){ return x.getUTCFullYear() + z(x.getUTCMonth() + 1) + z(x.getUTCDate()) + 'T' + z(x.getUTCHours()) + z(x.getUTCMinutes()) + '00Z'; };
      var ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','DTSTART:' + f(d),'DTEND:' + f(new Date(ms0 + 3600000)),'SUMMARY:' + r.name,'END:VEVENT','END:VCALENDAR'].join('\r\n');
      var u = URL.createObjectURL(new Blob([ics], {type: 'text/calendar'})), a = document.createElement('a');
      a.href = u; a.download = 'room.ics'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    };
    q('r-copy').onclick = function(){ copyTxt(location.href.split('#')[0]); };
    /*ctl*/

  function sectionEditor(sec){
    return function(body, msg){
      var ls = secToState(sec), store = {}, rI = [];
      var RFS = ['icon', 'name', 'prize', 'prizeLabel', 'entryFee', 'capacity', 'startedText'];
      function collect(){
        (SF[ls.type] || []).forEach(function(f){ ls[f[0]] = store[f[0]].value; });
        if (ls.type === 'rooms') {
          var old = ls.rooms;
          ls.rooms = rI.map(function(m, ix){
            var r = {};
            RFS.forEach(function(k){ r[k] = m[k].value; });
            r.start = m.start.value; r.desc = m.desc.value;
            r.players = m.players.map(function(p){ return {slot: p.a.value, cod: p.b.value, tg: p.c.value}; });
            r.roomCode = m.roomCode.value; r.accessPass = m.accessPass.value;
            r.secret = (old[ix] && old[ix].secret) || null; r.desc = m.desc.value; r.status = (old[ix] && old[ix].status) || ''; r.result = (old[ix] && old[ix].result) || null; r.finishedAt = (old[ix] && old[ix].finishedAt) || 0;
            return r;
          });
        }
      }
      function build(){
        body.textContent = ''; store = {}; rI = [];
        (SF[ls.type] || []).forEach(function(f){
          if (f[2] === 's') select(body, f[1], ls[f[0]], f[3], store, f[0]);
          else field(body, f[1], ls[f[0]], f[2] === 't', store, f[0], f[2] === 't');
        });
        if (ls.type === 'rooms') {
          ls.rooms.forEach(function(r, ri){
            var rb = el('div', 'rbox'), m = {players: []};
            rb.appendChild(el('h3', '', 'روم ' + fa(ri + 1)));
            [['icon','آیکون (ایموجی)'],['name','اسم روم'],['prize','مبلغ جایزه'],['prizeLabel','متن زیر جایزه'],['entryFee','ورودی (تومان)'],['capacity','ظرفیت روم (عدد)']].forEach(function(f){
              field(rb, f[1], r[f[0]], false, m, f[0]);
            });
            rb.appendChild(el('label', '', 'زمان شروع (به وقت ایران)'));
            var di = document.createElement('input'); di.type = 'datetime-local'; di.value = r.start; m.start = di; rb.appendChild(di);
            field(rb, 'متن بعد از شروع روم', r.startedText, false, m, 'startedText');
            field(rb, 'توضیحات روم (اختیاری، هر خط یک پاراگراف)', r.desc || '', true, m, 'desc');
            field(rb, 'توضیحات این روم (هر خط یک پاراگراف، اختیاری)', r.desc || '', true, m, 'desc');
            rb.appendChild(el('label', '', 'بازیکن‌ها (جایگاه و آیدی کالاف)'));
            var pl = el('div');
            r.players.forEach(function(p, pi){
              var row = el('div', 'prow');
              var a = document.createElement('input'); a.placeholder = 'جایگاه'; a.value = p.slot; a.className = 'ps'; a.setAttribute('inputmode', 'numeric');
              var b = document.createElement('input'); b.placeholder = 'آیدی کالاف'; b.value = p.cod; b.className = 'pc';
              var c = document.createElement('input'); c.placeholder = 'تلگرام (فقط برای تو)'; c.value = p.tg || ''; c.className = 'pt'; c.style.direction = 'ltr';
              row.appendChild(a); row.appendChild(b); row.appendChild(c);
              row.appendChild(btn('✕', function(){ collect(); ls.rooms[ri].players.splice(pi, 1); build(); }, 'del'));
              pl.appendChild(row); m.players.push({a: a, b: b, c: c});
            });
            rb.appendChild(pl);
            rb.appendChild(btn('➕ افزودن بازیکن', function(){
              collect();
              var used = ls.rooms[ri].players.map(function(p){ return parseInt(toEn(p.slot)); });
              var nx = 1; while (used.indexOf(nx) > -1) nx++;
              ls.rooms[ri].players.push({slot: String(nx), cod: '', tg: ''}); build();
            }, 'addroom'));
            var sec2 = el('div'); sec2.style.cssText = 'margin-top:12px;padding:10px;border:1px dashed var(--acc);border-radius:10px';
            var s1 = el('div', '', r.secret ? '🔒 کد روم ثبت شده است. برای تغییر، هر دو کادر را پر کنید. برای پاک کردن، در کادر کد فقط - بنویسید.' : '🔒 کد روم هنوز ثبت نشده');
            s1.style.fontWeight = '700'; sec2.appendChild(s1);
            field(sec2, 'کد روم (آیدی و رمز روم) که فقط با رمز دسترسی دیده می‌شود', r.roomCode, true, m, 'roomCode');
            field(sec2, 'رمز دسترسی (این را در تلگرام به بازیکن‌ها می‌دهید)', r.accessPass, false, m, 'accessPass');
            rb.appendChild(sec2);
            rb.appendChild(btn('حذف این روم', function(){
              if (ls.rooms.length <= 1) { msg.textContent = 'حداقل یک روم باید بماند. اگر نمی‌خواهید، کل بخش را حذف کنید.'; return; }
              collect(); ls.rooms.splice(ri, 1); build();
            }, 'delroom'));
            rI.push(m); body.appendChild(rb);
          });
          body.appendChild(btn('➕ افزودن روم جدید', function(){
            collect();
            var last = ls.rooms[ls.rooms.length - 1], o = roomToState(newRoomCfg());
            if (last) { RFS.forEach(function(k){ o[k] = last[k]; }); o.start = last.start; }
            o.name = 'روم جدید'; ls.rooms.push(o); build();
          }, 'addroom'));
        }
      }
      build();
      return async function(){ collect(); return await stateToSec(ls); };
    };
  }

  function settingsEditor(body){
    var gI = {}, tI = {};
    if (!art) {
      var gh = ghGet(); ghInputs = {};
      var box = el('div');
      box.style.cssText = 'padding:12px;border:1px dashed var(--acc);border-radius:12px;margin-bottom:8px';
      var t0 = el('div', '', 'اتصال به گیت‌هاب (برای ذخیره مستقیم روی سایت، فقط یک بار)'); t0.style.fontWeight = '700'; box.appendChild(t0);
      [['repo','مخزن، مثال: username/my-site', gh.repo || ''],['branch','شاخه (معمولاً main)', gh.branch || 'main'],['path','نام فایل (معمولاً index.html)', gh.path || 'index.html'],['token','توکن گیت‌هاب', gh.token || '']].forEach(function(f){
        box.appendChild(el('label', '', f[1]));
        var e = document.createElement('input'); e.value = f[2]; if (f[0] === 'token') e.type = 'password'; e.style.direction = 'ltr';
        ghInputs[f[0]] = e; box.appendChild(e);
      });
      body.appendChild(box);
    }
    GF.forEach(function(f){ field(body, f[1], C[f[0]] === undefined ? '' : C[f[0]], false, gI, f[0]); });
    body.appendChild(el('h2', '', '🎨 ظاهر سایت'));
    var th = C.theme || {};
    field(body, 'رنگ اصلی (مثال: #f5a524). خالی = پیش‌فرض', th.acc || '', false, tI, 'acc');
    field(body, 'رنگ دوم (مثال: #ff4d4d). خالی = پیش‌فرض', th.acc2 || '', false, tI, 'acc2');
    field(body, 'رنگ پس‌زمینه (مثال: #0b0f14). خالی = پیش‌فرض', th.bg || '', false, tI, 'bg');
    field(body, 'CSS دلخواه (برای کسانی که کد می‌دانند)', th.css || '', true, tI, 'css', true);
    tI.css.style.direction = 'ltr';
    return async function(){
      var g = {};
      GF.forEach(function(f){ g[f[0]] = gI[f[0]].value.trim(); });
      g.telegram = g.telegram.replace(/^@/, '').replace(/^https?:\/\/t\.me\//, '');
      return {g: g, theme: {acc: tI.acc.value.trim(), acc2: tI.acc2.value.trim(), bg: tI.bg.value.trim(), css: tI.css.value}};
    };
  }


  /* ---------- ویرایشگر تمام‌صفحه کد با رنگ‌بندی ---------- */
  var sourceCM = null;
  function openSourceEditor(){
    var panel = $('sourceEditor');
    panel.hidden = false;
    if (!sourceCM) {
      var loadCss = document.createElement('link');
      loadCss.rel = 'stylesheet';
      loadCss.href = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css';
      document.head.appendChild(loadCss);
      var themeCss = document.createElement('link');
      themeCss.rel = 'stylesheet';
      themeCss.href = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css';
      document.head.appendChild(themeCss);
      var js = document.createElement('script');
      js.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js';
      js.onload = function(){
        var mode = document.createElement('script');
        mode.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js';
        mode.onload = function(){
          var htmlMode = document.createElement('script');
          htmlMode.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js';
          htmlMode.onload = function(){
            var cssMode = document.createElement('script');
            cssMode.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js';
            cssMode.onload = function(){
              var mixed = document.createElement('script');
              mixed.src = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js';
              mixed.onload = function(){
                sourceCM = CodeMirror($('se-area'), {
                  value: '<!DOCTYPE html>\\n' + document.documentElement.outerHTML,
                  mode: 'htmlmixed', theme: 'material-darker',
                  lineNumbers: true, lineWrapping: false, tabSize: 2,
                  indentUnit: 2, viewportMargin: Infinity
                });
                sourceCM.setSize('100%', '100%');
                sourceCM.refresh();
              };
              document.head.appendChild(mixed);
            };
            document.head.appendChild(cssMode);
          };
          document.head.appendChild(htmlMode);
        };
        document.head.appendChild(mode);
      };
      document.head.appendChild(js);
    } else {
      sourceCM.setValue('<!DOCTYPE html>\\n' + document.documentElement.outerHTML);
      setTimeout(function(){ sourceCM.refresh(); }, 50);
    }
    $('se-status').textContent = 'کد HTML، CSS و JavaScript با رنگ‌بندی نمایش داده می‌شود.';
  }
  $('se-close').onclick = function(){ $('sourceEditor').hidden = true; };
  $('se-full').onclick = function(){
    var p = $('sourceEditor');
    if (!document.fullscreenElement && p.requestFullscreen) p.requestFullscreen();
    else if (document.exitFullscreen) document.exitFullscreen();
    setTimeout(function(){ if (sourceCM) sourceCM.refresh(); }, 150);
  };
  $('se-save').onclick = async function(){
    if (!sourceCM) { $('se-status').textContent = 'ویرایشگر هنوز بارگذاری نشده است.'; return; }
    var code = sourceCM.getValue();
    try {
      var g = ghGet();
      if (g.token && g.repo) {
        $('se-status').textContent = 'در حال ذخیره روی GitHub...';
        await ghCommit(g, code);
        $('se-status').textContent = 'کد روی GitHub ذخیره شد ✅';
      } else {
        var u = URL.createObjectURL(new Blob([code], {type:'text/html;charset=utf-8'}));
        var a = document.createElement('a'); a.href = u; a.download = 'index.html';
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
        $('se-status').textContent = 'فایل index.html دانلود شد؛ آن را جایگزین فایل قبلی کن.';
      }
    } catch(err) {
      $('se-status').textContent = 'ذخیره ناموفق: ' + (err.message || err);
    }
  };

  function markDirty(){ dirtyFlag = true; var s = $('edStat'); if (s) s.textContent = '● تغییرات ذخیره‌نشده'; }
  function chooseType(cb){
    var ov = el('div'); ov.id = 'edOverlay';
    ov.appendChild(el('h2', '', 'چه چیزی اضافه شود؟'));
    var grid = el('div', 'tgrid');
    TYPES.forEach(function(t){ grid.appendChild(btn(t[1], function(){ ov.remove(); cb(t[0]); }, 'tbtn')); });
    ov.appendChild(grid);
    var bar = el('div', 'bar2'); bar.appendChild(btn('لغو', function(){ ov.remove(); })); ov.appendChild(bar);
    document.body.appendChild(ov);
  }
  function editSection(idx){
    var sec = C.sections[idx];
    modal('ویرایش · ' + typeLabel(sec.type), sectionEditor(sec), async function(v){ C.sections[idx] = v; markDirty(); render(); });
  }
  function addAt(pos){
    chooseType(function(t){ C.sections.splice(pos, 0, newCfgSection(t)); markDirty(); render(); editSection(pos); });
  }
  function sectionBar(i, s){
    var b = el('div', 'secbar');
    b.appendChild(el('span', 'sl2', 'بخش ' + fa(i + 1) + ' · ' + typeLabel(s.type)));
    var t = el('span', 'st');
    t.appendChild(btn('✏️ ویرایش', function(){ editSection(i); }, 'ed'));
    t.appendChild(btn('▲', function(){ if (i > 0) { var a = C.sections, x = a[i - 1]; a[i - 1] = a[i]; a[i] = x; markDirty(); render(); } }));
    t.appendChild(btn('▼', function(){ if (i < C.sections.length - 1) { var a = C.sections, x = a[i + 1]; a[i + 1] = a[i]; a[i] = x; markDirty(); render(); } }));
    t.appendChild(btn('➕ قبل', function(){ addAt(i); }));
    t.appendChild(btn('🗑', function(){ if (confirm('این بخش حذف شود؟')) { C.sections.splice(i, 1); markDirty(); render(); } }, 'del'));
    b.appendChild(t);
    return b;
  }
  async function publishSite(){
    var n = JSON.parse(JSON.stringify(C));
    n.sections.forEach(function(s){ if (s.type === 'rooms' && s.rooms) s.rooms = s.rooms.filter(function(r){ return !roomExpired(r); }); });
    var root = document.documentElement.cloneNode(true);
    root.querySelector('#cfg').textContent = JSON.stringify(n).replace(/</g, String.fromCharCode(92) + 'u003c');
    ['edOverlay', 'edBar', 'edBtn'].forEach(function(id){ var x = root.querySelector('#' + id); if (x) x.remove(); });
    root.querySelector('#content').textContent = '';
    root.removeAttribute('style'); root.removeAttribute('data-theme');
    var bd = root.querySelector('body'); bd.classList.remove('editing'); bd.classList.remove('owner'); if (!bd.getAttribute('class')) bd.removeAttribute('class');
    var html = '<!DOCTYPE html>' + String.fromCharCode(10) + root.outerHTML;
    var why = '';
    try {
      if (art) { await art.publish(html); return 'منتشر شد ✅'; }
      var g = ghGet();
      if (g.token && g.repo) { await ghCommit(g, html); return 'ذخیره شد ✅ بعد از حدود یک دقیقه برای همه به‌روز می‌شود.'; }
    } catch(x) { why = (x && (x.code || x.message)) || String(x); }
    var u = URL.createObjectURL(new Blob([html], {type: 'text/html'}));
    var dl = document.createElement('a'); dl.href = u; dl.download = 'index.html'; document.body.appendChild(dl); dl.click(); dl.remove();
    return (why ? 'ذخیره مستقیم نشد (' + why + ')؛ ' : '') + 'فایل جدید دانلود شد. آن را جای فایل قبلی بگذارید. (برای ذخیره مستقیم، در ⚙️ تنظیمات به گیت‌هاب وصل شوید)';
  }
  function enterEdit(){
    if (editing) return;
    editing = true; document.body.classList.add('editing');
    var b0 = $('edBtn'); if (b0) b0.remove();
    var bar = el('div'); bar.id = 'edBar';
    bar.appendChild(btn('💾 ذخیره', async function(){
      var st = $('edStat'); st.textContent = 'در حال ذخیره...';
      try { var m = await publishSite(); dirtyFlag = false; st.textContent = m; }
      catch(x) { st.textContent = 'ذخیره نشد: ' + ((x && (x.code || x.message)) || ''); }
    }, 'sv'));
    bar.appendChild(btn('⚙️ تنظیمات', function(){
      modal('⚙️ تنظیمات سایت', settingsEditor, async function(v){
        GF.forEach(function(f){ C[f[0]] = v.g[f[0]]; });
        C.theme = v.theme; saveGh(); markDirty(); render();
      });
    }));
    bar.appendChild(btn('کد کامل </>', openSourceEditor));
    bar.appendChild(btn('✖ خروج', function(){
      if (dirtyFlag && !confirm('تغییرات ذخیره‌نشده از بین می‌رود. خارج می‌شوید؟')) return;
      location.reload();
    }));
    var st0 = el('span'); st0.id = 'edStat'; bar.appendChild(st0);
    document.body.appendChild(bar);
    render();
  }
  function showBtn(){
    if ($('edBtn')) return;
    var b = el('button', '', '✏️ ویرایش سایت'); b.id = 'edBtn';
    b.onclick = enterEdit; document.body.appendChild(b);
  }
  (async function(){
    var owner = false;
    try {
      if (window.claude && claude.use) {
        var u = await claude.use('user');
        owner = u ? await u.isOwner() : false;
        if (owner) art = await claude.use('artifact');
      }
    } catch(x) {}
    if (owner) document.body.classList.add('owner');
    if (owner || location.hash === '#edit' || ghGet().token) showBtn();
  })();
})();

(function(){
  var h = document.documentElement, $ = function(i){ return document.getElementById(i); };
  try { if (location.hash === '#edit') localStorage.setItem('isOwner', '1'); if (localStorage.getItem('isOwner') === '1' || JSON.parse(localStorage.getItem('ghcfg') || '{}').token) document.body.classList.add('owner'); } catch(x) {}
  try { var t = localStorage.getItem('theme'); if (t) h.setAttribute('data-theme', t); } catch(x) {}
  $('themeBtn').onclick = function(){
    var dark = h.getAttribute('data-theme') ? h.getAttribute('data-theme') === 'dark' : !matchMedia('(prefers-color-scheme:light)').matches;
    var n = dark ? 'light' : 'dark'; h.setAttribute('data-theme', n);
    try { localStorage.setItem('theme', n); } catch(x) {}
  };
  $('shareBtn').onclick = function(){
    var u = location.href.split('#')[0];
    if (navigator.share) navigator.share({title: document.title, url: u}).catch(function(){});
    else try { navigator.clipboard.writeText(u); var e = $('toast'); e.textContent = 'لینک کپی شد ✅'; e.style.display = 'block'; setTimeout(function(){ e.style.display = 'none'; }, 1800); } catch(x) {}
  };
  var tp = $('toTop');
  addEventListener('scroll', function(){ tp.style.display = scrollY > 600 ? 'block' : 'none'; }, {passive: true});
  tp.onclick = function(){ scrollTo({top: 0, behavior: 'smooth'}); };
})();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
